<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/src/ico/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/src/ico/favicon.svg" />
  <link rel="shortcut icon" href="assets/src/ico/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/src/ico/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="D2Glossary" />
  <link rel="manifest" href="assets/src/ico/site.webmanifest" />

  <!-- Preload ressources critiques -->
  <link rel="preload" href="assets/fonts/NeueHaasDisplayRoman.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/src/ico/logo-d2glossaire.png" as="image">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/banniere.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/d2elementstyles.css">
  <link rel="stylesheet" href="assets/css/pagination.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <link rel="stylesheet" href="assets/css/language-selector.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/css/banniere.css">
  <link rel="stylesheet" href="assets/css/popupitem.css">
  <link rel="stylesheet" href="assets/css/ddcvacuum-popup.css">

  <title>D2Glossary - Perks</title>
</head>
<body>
  <!-- Sélecteur de langue -->
  <div id="language-selector-container"></div>

  <div id="banniere-container"></div>

  <div class="search-box">
    <div class="input-container">
      <input type="text" id="search" placeholder="Rechercher une perk d'arme...">
      <button id="clear-button" class="clear-button" aria-label="Clear">✖</button>
    </div>
    <div id="result-count"></div>
  </div>

  <div class="grid" id="card-list"></div>

  <div id="popupitem-container"></div>

  <!-- JS - Charger dataManager avant tout -->
  <script type="module">
    import { loadHTML } from './assets/js/utils.js';
    import { checkVersion } from './assets/js/dataManager.js';
    import { loadItemListPage } from './assets/js/itemListPage.js';
    import { initLanguageSystem } from './assets/js/languageSelector.js';

    // Charger la bannière avec navigation
    await loadHTML('assets/html/banniere.html', 'banniere-container');

    // Importer et initialiser la navigation
    const { initBanniereNavigation } = await import('./assets/js/banniere.js');
    initBanniereNavigation();

    // Initialiser le système de langue
    const lang = initLanguageSystem();

    // Vérifier la version avant de charger les données
    await checkVersion();

    // Charger la page avec les données de la langue active
    loadItemListPage({
      dataFile: `data/${lang}/item_definitions.json`,
      excludedIds: ["2962854089", "2823622571", "3196242660"],
      containerId: 'card-list',
      inputId: 'search',
      itemsPerPage: 35,
      filterOptions: {
        itemCategoryHash: [59, 3708671066, 610365472],
        itemType: 19,
        itemSubType: 0,
        classType: 3,
        breakerType: 0
      }
    });
  </script>
</body>
</html>
