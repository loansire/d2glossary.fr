<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/src/ico/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/src/ico/favicon.svg" />
  <link rel="shortcut icon" href="assets/src/ico/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/src/ico/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="D2Glossary" />
  <link rel="manifest" href="assets/src/ico/site.webmanifest" />

  <!-- Preload ressources critiques -->
  <link rel="preload" href="assets/fonts/NeueHaasDisplayRoman.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/src/ico/logo-d2glossaire.png" as="image">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <title>D2Glossary</title>
</head>
<body>
  <div id="banniere-container"></div>
  <div class="nav-container" id="nav-list"></div>

  <!-- Charger dataManager en premier -->
  <script type="module">
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/assets/js/sw.js')
        .then(reg => console.log('[App] Service Worker enregistré:', reg.scope))
        .catch(err => console.error('[App] Erreur SW:', err));
    }

    // Import des modules
    import { loadHTML } from './assets/js/utils.js';
    import { checkVersion, preloadLightFiles } from './assets/js/dataManager.js';

    // Vérifier la version et précharger les fichiers légers
    await checkVersion();

    // Précharger en arrière-plan (non-bloquant)
    preloadLightFiles();

    // Charger la bannière
    await loadHTML('assets/html/banniere.html', 'banniere-container');

    // Configuration des sous-pages
    const subfolders = [
      {
        name: "Artefact Saisonnier",
        path: "artefact",
        image: "assets/src/artefact_thumb.jpg",
        subtitle: "Définition de l'artefact saisonnier"
      },
      {
        name: "Set d'armures",
        path: "setarmor",
        image: "assets/src/Setarmor_thumb.jpg",
        subtitle: "Définition des Sets d'armures"
      },
      {
        name: "Perks",
        path: "perk",
        image: "assets/src/Perks_thumb.jpg",
        subtitle: "Définition des termes de perks d'armes"
      },
      {
        name: "Traits",
        path: "trait",
        image: "assets/src/Traits_thumb.jpg",
        subtitle: "Définition des termes de doctrines"
      },
      {
        name: "Champions",
        path: "breaker",
        image: "assets/src/Champions_thumb.jpg",
        subtitle: "Définition des termes de Champions"
      },
      {
        name: "Dégâts",
        path: "damagetype",
        image: "assets/src/Doctrine_thumb.jpg",
        subtitle: "Définition des termes de dégâts"
      },
      {
        name: "Modificateurs",
        path: "modifier",
        image: "assets/src/modifier_thumb.jpg",
        subtitle: "Définition des modificateurs en jeu"
      }
    ];

    // Générer les cartes de navigation
    const container = document.getElementById('nav-list');

    subfolders.forEach((entry, index) => {
      const card = document.createElement('a');
      card.className = 'nav-card animate__animated animate__fadeInUp';
      card.style.animationDelay = `${index * 0.05}s`;
      card.href = `${entry.path}.html`;
      card.title = entry.name;

      card.innerHTML = `
        <img src="${entry.image}" class="nav-image" alt="d2glossary - ${entry.name}" loading="lazy">
        <div class="nav-content">
          <div class="nav-title">${entry.name}</div>
          <div class="nav-subtitle">${entry.subtitle}</div>
        </div>
      `;

      container.appendChild(card);
    });
  </script>
</body>
</html>
