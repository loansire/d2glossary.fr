<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/src/ico/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/src/ico/favicon.svg" />
  <link rel="shortcut icon" href="assets/src/ico/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/src/ico/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="D2Glossary" />
  <link rel="manifest" href="assets/src/ico/site.webmanifest" />

  <!-- Preload ressources critiques -->
  <link rel="preload" href="assets/fonts/NeueHaasDisplayRoman.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/src/ico/logo-d2glossaire.png" as="image">

  <!-- CSS - Ordre important -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/d2elementstyles.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <link rel="stylesheet" href="assets/css/language-selector.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/css/artefact.css">
  <link rel="stylesheet" href="assets/css/artefact-tooltip.css">

  <title>D2Glossary - Artefact</title>
</head>
<body class="consultation-mode">
  <!-- Sélecteur de langue -->
  <div id="language-selector-container"></div>

  <div id="banniere-container"></div>

  <div class="container">
    <div class="header">
      <h1>Artefact Saisonnier</h1>
    </div>

    <div class="mode-switch-container">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="consultation">Consultation</button>
        <button class="mode-btn" data-mode="configuration">Configuration</button>
      </div>
    </div>

    <div class="control-buttons">
      <button class="control-btn" id="shareBtn" title="Partager la sélection">📤 Partager</button>
      <button class="control-btn" id="resetBtn" title="Réinitialiser la sélection">🔄 Réinitialiser</button>
    </div>

    <div class="progress-container">
      <div class="progress-header">
        <div class="progress-title">Progression de sélection</div>
        <div class="progress-counter" id="progressCounter">0/12</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="tier-markers" id="tierMarkers"></div>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <div id="tooltip-container"></div>

  <script type="module">
    import { loadHTML } from './assets/js/utils.js';
    import { checkVersion } from './assets/js/dataManager.js';
    import { loadArtefactPage } from './assets/js/artefactPage.js';
    import { initLanguageSystem } from './assets/js/languageSelector.js';

    // Initialiser le système de langue
    const lang = initLanguageSystem();

    // Vérifier la version avant de charger les données
    await checkVersion();

    // Charger la bannière et le tooltip
    await loadHTML('assets/html/banniere.html', 'banniere-container');
    await loadHTML('assets/html/artefact-tooltip.html', 'tooltip-container');

    // Charger la page avec les données de la langue active
    loadArtefactPage({
      dataFile: `data/${lang}/artefact_definitions_enriched.json`,
      containerId: 'content',
      tooltipId: 'tooltip'
    });
  </script>
</body>
</html>
